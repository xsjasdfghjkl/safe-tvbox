name: 构建 APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时创建一个 Release（方便直接下载）'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 授权 gradlew（若存在）
        run: chmod +x gradlew 2>/dev/null || true

      - name: 编译 Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 编译 Release APK（未签名，仅供自取）
        run: gradle assembleRelease --stacktrace
        continue-on-error: true

      - name: 整理产物文件名
        run: |
          mkdir -p apk-out
          TS=$(date +'%Y%m%d-%H%M')
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "apk-out/SafeTVBox-debug-$TS.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "apk-out/SafeTVBox-release-unsigned-$TS.apk"
          fi
          ls -lh apk-out

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: SafeTVBox-APK
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 创建 Release
        if: ${{ github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SafeTVBox ${{ github.ref_name }}
          body: |
            自动构建产物。

            - `SafeTVBox-debug-*.apk`：已签名，可直接安装
            - `SafeTVBox-release-unsigned-*.apk`：未签名发布版，需自行 apksigner 签名

            源码已在仓库中，可对照核验。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
